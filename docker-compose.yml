services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-chartdb_sid}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chartdb
      # Attach this service to the network your existing Postgres container
      # runs on, then point DATABASE_URL at that container's name/port.
      # - postgres_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STORAGE_MODE: api
        VITE_HIDE_CHARTDB_CLOUD: ${VITE_HIDE_CHARTDB_CLOUD:-true}
        VITE_DISABLE_ANALYTICS: ${VITE_DISABLE_ANALYTICS:-true}
        VITE_OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
        VITE_OPENAI_API_ENDPOINT: ${VITE_OPENAI_API_ENDPOINT:-}
        VITE_LLM_MODEL_NAME: ${VITE_LLM_MODEL_NAME:-}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    environment:
      API_PROXY_TARGET: http://server:3001
      WS_PROXY_TARGET: http://server:3001
      STORAGE_MODE: api
      OPENAI_API_KEY: ${VITE_OPENAI_API_KEY:-}
      OPENAI_API_ENDPOINT: ${VITE_OPENAI_API_ENDPOINT:-}
      LLM_MODEL_NAME: ${VITE_LLM_MODEL_NAME:-}
      HIDE_CHARTDB_CLOUD: ${VITE_HIDE_CHARTDB_CLOUD:-true}
      DISABLE_ANALYTICS: ${VITE_DISABLE_ANALYTICS:-true}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - chartdb

networks:
  chartdb:
    driver: bridge
  # Uncomment and point at your existing Postgres container's network so
  # `server` can reach it by container name:
  # postgres_net:
  #   external: true
  #   name: <your-postgres-network-name>
